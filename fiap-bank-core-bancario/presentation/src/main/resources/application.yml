server:
  port: 8080

spring:
  application:
    name: fiap-bank-core-bancario
  datasource:
    url: jdbc:h2:mem:corebancariodb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
